name: api-qa
on: [push, pull_request]
jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      matrix: {mode: [fixed, vulnerable]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Fixed build must be fully green
        if: matrix.mode == 'fixed'
        run: APP_MODE=fixed pytest -q --junitxml=junit.xml
      - name: Vulnerable build must FAIL exactly the 9 seeded checks (proves the suite has teeth)
        if: matrix.mode == 'vulnerable'
        run: |
          APP_MODE=vulnerable pytest -q --junitxml=junit.xml | tee out.txt || true
          grep -q "9 failed" out.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "junit-${{ matrix.mode }}", path: junit.xml}
  live-schemathesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tasks-api .
      - run: docker run -d -p 8000:8000 -e ALLOW_TEST_RESET=1 tasks-api && sleep 3
      - run: pip install -r requirements.txt && BASE_URL=http://127.0.0.1:8000 pytest -q tests/functional tests/security
      - run: schemathesis run http://127.0.0.1:8000/openapi.json -H "Authorization: Bearer tok-admin" --max-examples 50
